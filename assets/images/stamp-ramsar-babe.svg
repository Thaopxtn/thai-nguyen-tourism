<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <path id="circlePathTop1" d="M 30,100 A 70,70 0 0,1 170,100" />
    <path id="circlePathBottom1" d="M 170,100 A 70,70 0 0,1 30,100" />
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="jadeGleam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Outer Scalloped / Perforated Postage Ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#goldGleam)" stroke-width="2.5" stroke-dasharray="3,3.5"/>
  <circle cx="100" cy="100" r="90" fill="#0f2916" stroke="url(#goldGleam)" stroke-width="1.8"/>
  <circle cx="100" cy="100" r="76" fill="#14381e" stroke="url(#goldGleam)" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Curved Text Top & Bottom -->
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="url(#goldGleam)" letter-spacing="2.8">
    <textPath href="#circlePathTop1" startOffset="50%" text-anchor="middle">
      RAMSAR SITE No. 1938
    </textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="url(#goldGleam)" letter-spacing="3.2">
    <textPath href="#circlePathBottom1" startOffset="50%" text-anchor="middle">
      BA BE LAKE &bull; VIETNAM
    </textPath>
  </text>

  <!-- Center Artwork: Ba Be Karst & Canoe -->
  <g transform="translate(100, 100)">
    <!-- Sun -->
    <circle cx="0" cy="-24" r="9" fill="url(#goldGleam)" opacity="0.9"/>
    
    <!-- Mountains -->
    <polygon points="-42,8 -20,-16 -2,4" fill="#0d2414" stroke="url(#goldGleam)" stroke-width="1.2"/>
    <polygon points="-8,8 14,-22 38,10" fill="#12301b" stroke="url(#goldGleam)" stroke-width="1.2"/>
    <polygon points="-24,10 0,-10 22,10" fill="#173d23" stroke="url(#goldGleam)" stroke-width="1.2"/>

    <!-- Water Ripples -->
    <path d="M-38,16 C-20,13 0,19 18,16 C28,14 34,17 38,16" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M-30,22 C-15,19.5 5,24 20,22 C28,21 32,23 35,22" fill="none" stroke="#2dd4bf" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Dugout Canoe (Thuyền độc mộc) -->
    <path d="M-18,19 C-5,17 8,17 22,19 C18,22 -8,22 -18,19 Z" fill="#d4af37"/>
    <line x1="2" y1="13" x2="8" y2="24" stroke="url(#goldGleam)" stroke-width="1.2"/>
    <circle cx="2" cy="11" r="2.2" fill="#fef08a"/>
  </g>

  <!-- Decorative Stars -->
  <polygon points="100,12 102,17 107,17 103,20 105,25 100,22 95,25 97,20 93,17 98,17" fill="url(#goldGleam)"/>
</svg>