<!DOCTYPE html><html><body style='background:#f4f4ee;padding:40px;'><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-10 h-10 shrink-0 filter drop-shadow-[0_2px_8px_rgba(20,40,25,0.25)]">
  <defs>
    <linearGradient id="tnBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b3820"/>
      <stop offset="60%" stop-color="#0f2314"/>
      <stop offset="100%" stop-color="#08140b"/>
    </linearGradient>
    <linearGradient id="tnGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc5"/>
      <stop offset="45%" stop-color="#d4a34b"/>
      <stop offset="100%" stop-color="#9a7024"/>
    </linearGradient>
    <linearGradient id="tnLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="tnWaterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="tnSunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Luxury Squircle Crest Base -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="url(#tnBgGrad)" stroke="url(#tnGoldGrad)" stroke-width="1.3"/>
  <rect x="3.5" y="3.5" width="41" height="41" rx="11" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Golden Morning Sun / Pristine Dewdrop -->
  <circle cx="24" cy="13" r="3.2" fill="url(#tnGoldGrad)"/>
  <circle cx="24" cy="13" r="5.5" fill="url(#tnSunGlow)" opacity="0.65"/>

  <!-- Karst Limestone Peaks (Ba Be Karst & Phượng Hoàng) -->
  <path d="M9 30 L18 17.5 L24.5 25.5" fill="none" stroke="#24512e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M23.5 25.5 L29.5 19 L39 30" fill="none" stroke="#2e6439" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stylized Emerging Tea Shoot (Búp Chè Tân Cương Đệ Nhất) -->
  <path d="M24 27 C24 22 22 17.5 23.8 13.5 C25.8 17.5 26.8 22 24 27 Z" fill="url(#tnLeafGrad)"/>
  <path d="M24.2 21 C25.8 19 28 18.8 29 16.5 C28 20.2 25.5 22.5 24.2 23 Z" fill="url(#tnLeafGrad)" opacity="0.9"/>

  <!-- Ba Be Pristine Waters (Làn Sóng Hồ Ba Bể) -->
  <path d="M11 33.5 C15.5 31.8 19.5 35 24 33.5 C28.5 32 32.5 35 37 33.5" fill="none" stroke="url(#tnWaterGrad)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M14 37 C17.5 35.8 20.8 38 24 37 C27.2 36 30.5 38 34 37" fill="none" stroke="url(#tnWaterGrad)" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>
</svg></body></html>
